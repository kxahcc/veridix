services:
  pgvector:
    image: ${VERIDIX_STORAGE_REGISTRY:-docker.m.daocloud.io/}pgvector/pgvector:pg16
    command: ["postgres", "-p", "${VERIDIX_PGVECTOR_INTERNAL_PORT:-5432}"]
    environment:
      POSTGRES_USER: veridix
      POSTGRES_PASSWORD: veridix
      POSTGRES_DB: veridix
      PGPORT: ${VERIDIX_PGVECTOR_INTERNAL_PORT:-5432}
    ports:
      - "${VERIDIX_PGVECTOR_PORT:-55432}:${VERIDIX_PGVECTOR_INTERNAL_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridix -d veridix -p ${VERIDIX_PGVECTOR_INTERNAL_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: ${VERIDIX_STORAGE_REGISTRY:-docker.m.daocloud.io/}qdrant/qdrant:latest
    ports:
      - "6333:6333"

  chroma:
    image: ${VERIDIX_STORAGE_REGISTRY:-docker.m.daocloud.io/}chromadb/chroma:latest
    ports:
      - "8001:8000"

  neo4j:
    image: ${VERIDIX_STORAGE_REGISTRY:-docker.m.daocloud.io/}neo4j:5
    environment:
      NEO4J_AUTH: neo4j/veridixpass
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
