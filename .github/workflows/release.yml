name: publish-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    env:
      RELEASE_DIR: ${{ runner.temp }}/veridix-release
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r services/requirements.txt
      - name: Ensure 7-Zip
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
            choco install 7zip -y
          }
      - run: npm ci
      - run: npm run build
      - name: Package desktop
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v',''
          New-Item -ItemType Directory -Force -Path $env:RELEASE_DIR | Out-Null
          python scripts/package_desktop.py `
            --out "$env:RELEASE_DIR/desktop" `
            --version $version `
            --skip-build `
            --zip `
            --sign
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v',''
          python scripts/build_windows_installer.py `
            --version $version `
            --out "$env:RELEASE_DIR" `
            --payload-dir "$env:RELEASE_DIR/desktop"
      - name: Build source archives
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v',''
          git archive --format=zip -o "$env:RELEASE_DIR/veridix-$version-source.zip" $env:RELEASE_VERSION
          git archive --format=tar.gz -o "$env:RELEASE_DIR/veridix-$version-source.tar.gz" $env:RELEASE_VERSION
      - name: Checksums and signed manifest
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v',''
          Get-ChildItem "$env:RELEASE_DIR" -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            $name = Split-Path $_.Path -Leaf
            "$($_.Hash.ToLower())  $name"
          } | Set-Content "$env:RELEASE_DIR/SHA256SUMS.txt"
          $py = @'
import hashlib, json, os, sys
from pathlib import Path
sys.path.insert(0, str(Path.cwd()))
from services.release_service.signing import generate_keypair, sign_bytes, verify_bytes
out = Path(os.environ["RELEASE_DIR"])
artifacts = sorted(
    p.name for p in out.iterdir()
    if p.is_file() and p.name.endswith((".zip", ".tar.gz", ".exe"))
)
entries = {}
for name in artifacts:
    data = (out / name).read_bytes()
    entries[name] = {"sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
private_key, public_key = generate_keypair()
manifest = {
    "product": "veridix",
    "version": os.environ.get("RELEASE_VERSION", "").lstrip("v"),
    "tag": os.environ.get("RELEASE_VERSION", ""),
    "commit": os.environ.get("GITHUB_SHA", ""),
    "generated_at": os.environ.get("GITHUB_RUN_ID", ""),
    "public_key": public_key,
    "artifacts": entries,
}
payload = json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True).encode("utf-8")
signature = sign_bytes(payload, private_key)
assert verify_bytes(payload, signature, public_key)
(out / "release-manifest.json").write_bytes(payload)
(out / "release-manifest.sig").write_text(signature, encoding="ascii")
(out / "veridix-public-key.txt").write_text(public_key + "\n", encoding="ascii")
'@
          $py | python -
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Veridix ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: ${{ env.RELEASE_DIR }}/*
