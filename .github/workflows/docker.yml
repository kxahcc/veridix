name: publish-docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r services/requirements.txt
      - run: python scripts/fetch_tool_binaries.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dev image
        run: |
          docker build -t ghcr.io/kxahcc/veridix/veridix-tools:dev             -f deploy/container/veridix-tools/Dockerfile .
          docker push ghcr.io/kxahcc/veridix/veridix-tools:dev

      - name: Build full image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t ghcr.io/kxahcc/veridix/veridix-tools:full             -t ghcr.io/kxahcc/veridix/veridix-tools:${VERSION}-full             -f deploy/container/veridix-tools/Dockerfile.full             --build-arg BASE_IMAGE=ghcr.io/kxahcc/veridix/veridix-tools:dev .
          docker push ghcr.io/kxahcc/veridix/veridix-tools:full
          docker push ghcr.io/kxahcc/veridix/veridix-tools:${VERSION}-full

      - name: Build code image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t ghcr.io/kxahcc/veridix/veridix-tools:code             -t ghcr.io/kxahcc/veridix/veridix-tools:${VERSION}-code             -f deploy/container/veridix-tools/Dockerfile.code             --build-arg BASE_IMAGE=ghcr.io/kxahcc/veridix/veridix-tools:full .
          docker push ghcr.io/kxahcc/veridix/veridix-tools:code
          docker push ghcr.io/kxahcc/veridix/veridix-tools:${VERSION}-code

      - name: Build code-lite image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t ghcr.io/kxahcc/veridix/veridix-tools:code-lite             -t ghcr.io/kxahcc/veridix/veridix-tools:${VERSION}-code-lite             -f deploy/container/veridix-tools/Dockerfile.code-lite .
          docker push ghcr.io/kxahcc/veridix/veridix-tools:code-lite
          docker push ghcr.io/kxahcc/veridix/veridix-tools:${VERSION}-code-lite
