name: publish-npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish SDK packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERIDIX_NPM }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "VERIDIX_NPM secret is empty; configure it under repository settings."
            exit 1
          fi
          npm config set "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN"
          npm publish -w @veridix/contracts --access public --registry https://registry.npmjs.org
          npm publish -w @veridix/config --access public --registry https://registry.npmjs.org
          npm publish -w @veridix/sdk-typescript --access public --registry https://registry.npmjs.org
